<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body class="bg-secondary">
<header th:replace="~{fragments/commons::nav}"></header>
<main role="main" class="bg-secondary">
    <div class="jumbotron">
        <div class="container text-light ">
            <h1 class="display-3 ">
                <strong class="bg-blur rounded border-left border-white pl-3 border-bottom">Add Order</strong></h1>
        </div>
        <div class="container bg-blur rounded p-5 mt-5 w-75">
            <form th:action="@{/orders/add}" th:object="${order}" method="POST"
                  class=" text-center text-light">
                <div class="form-group row">
                    <label for="name" class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" th:field="*{name}"
                               aria-describedby="nameHelpInline" placeholder="Name">
                        <small id="nameHelpInline" class="bg-danger text-light rounded" th:if="${#fields.hasErrors('name')}">
                            Name must be between 3 and 20 characters.
                        </small>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="price" class="col-sm-2 col-form-label">Price</label>
                    <div class="col-sm-10">
                        <input type="number" step="0.01" class="form-control" th:field="*{price}"
                               aria-describedby="priceHelpInline">
                        <small id="priceHelpInline" class="bg-danger text-light rounded" th:if="${#fields.hasErrors('price')}">
                            Price must be positive.
                        </small>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="orderTime" class="col-sm-2 col-form-label">Order time</label>
                    <div class="col-sm-10">
                        <input type="datetime-local" class="form-control" th:field="*{orderTime}"
                               aria-describedby="orderTimeHelpInline">
                        <small id="orderTimeHelpInline" class="bg-danger text-light rounded" th:if="${#fields.hasErrors('orderTime')}">
                            Order time cannot be in the future.
                        </small>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="category" class="col-sm-2 col-form-label">Category</label>
                    <div class="col-sm-10">
                        <select th:field="*{category}" class="custom-select"
                                aria-describedby="categoryHelpInline">
                            <option value="">Category</option>
                            <option th:each="c : ${categories}" th:value="${c}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(c))}">Coffee</option>
                        </select>
                        <small id="categoryHelpInline" class="bg-danger text-light rounded" th:if="${#fields.hasErrors('category')}">
                            You must select the category.
                        </small>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="description" class="col-sm-2 col-form-label">Description</label>
                    <div class="col-sm-10">
                        <textarea class="form-control" th:field="*{description}"
                                  aria-describedby="descriptionHelpInline" placeholder="Description"></textarea>
                        <small id="descriptionHelpInline" class="bg-danger text-light rounded" th:if="${#fields.hasErrors('description')}">
                            The description must be more than 5 characters.
                        </small>
                    </div>
                </div>
                <button type="submit" class="btn btn-info w-50">Add order</button>
            </form>
            <hr class="bg-light">
        </div>
    </div>
</main>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
