<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
<div th:replace="~{fragments/commons::nav}"></div>
<div class="container">
    <h2 class="text-center text-white">Register User</h2>
    <form method="POST" th:action="@{/users/register}" th:object="${user}"
          class="main-form mx-auto col-md-8 d-flex flex-column justify-content-center">
        <div class="row">
            <div class="form-group col-md-6 mb-3">
                <label for="firstName" class="text-white font-weight-bold">First Name</label>
                <input th:field="*{firstName}" type="text" class="form-control" placeholder="First Name"/>
                <p class="errors alert alert-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">
                    First Name is required.
                </p>
            </div>
            <div class="form-group col-md-6 mb-3">
                <label for="lastName" class="text-white font-weight-bold">Last Name</label>
                <input th:field="*{lastName}" type="text" class="form-control" placeholder="Last Name"/>
                <p class="errors alert alert-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">
                    Last Name is required.
                </p>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-6 mb-3">
                <label for="username" class="text-white font-weight-bold">Username</label>
                <input th:field="*{username}" type="text" class="form-control" placeholder="Username"/>
                <p class="errors alert alert-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                    Username is required.
                </p>
            </div>
            <div class="form-group col-md-6 mb-3">
                <label for="password" class="text-white font-weight-bold">Password</label>
                <input th:field="*{password}" type="password" class="form-control" placeholder="Password"/>
                <p class="errors alert alert-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                    Password is required.
                </p>
            </div>
        </div>
        <div class="row">
            <div class="col col-md-4">
                <div class="button-holder d-flex">
                    <input type="submit" class="btn btn-info btn-lg" value="Register"/>
                </div>
            </div>
        </div>
    </form>
</div>
<div>
    <footer></footer>
</div>
</body>
</html>
