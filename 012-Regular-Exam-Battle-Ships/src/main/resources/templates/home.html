<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body class="body-main">
<header th:replace="~{fragments/commons::nav}"></header>
<main role="main">
    <div class="jumbotron">
        <h1 class="text-center p-5 text-white font-weight-bold">Battle</h1>
        <form th:action="@{/battle}" th:object="${battle}" method="POST" class="row mb-2">
            <div class="col-md-6">
                <div class="card flex-md-row bg-blur mb-4 box-shadow h-md-250">
                    <div class="card-body d-flex flex-column align-items-start">
                        <strong class="d-inline-block mb-2 text-primary">Attacker</strong>
                        <h3 class="mb-0 text-white">
                            Select the attacker
                        </h3>
                        <div class="mb-1 text-white">Select one of the ships that are owned by the current user</div>
                        <select class="form-select mt-5" th:field="*{attackerId}" aria-label="Attacker">
                            <option value="">Select one of the ships that are owned by the current user</option>
                            <option th:each="s : ${ownShips}" th:value="${s.id}" th:text="${s.name}">One</option>
                        </select>
                    </div>
                    <img class="card-img-right flex-auto d-none d-md-block"
                         style="width: 200px; height: 250px;"
                         src="/images/attacker.jpg" alt="Attacker">
                </div>
            </div>
            <div class="col-md-6">
                <div class="bg-blur card flex-md-row mb-4 box-shadow h-md-250">
                    <div class="card-body d-flex flex-column align-items-start">
                        <strong class="d-inline-block mb-2 text-danger">Defender</strong>
                        <h3 class="mb-0 text-white">
                            Select the defender
                        </h3>
                        <div class="mb-1 text-white">Select one of the ships that are owned by other users</div>
                        <select class="form-select mt-5" th:field="*{defenderId}" aria-label="Defender">
                            <option value="">Select one of the ships that are owned by other users</option>
                            <option th:each="s : ${otherShips}" th:value="${s.id}" th:text="${s.name}">One</option>
                        </select>
                    </div>
                    <img class="card-img-right flex-auto d-none d-md-block"
                         src="/images/defender.jpg" alt="Defender" style="width: 200px; height: 250px;">
                </div>
            </div>
            <button type="submit" class="col-md-6 mx-auto btn btn-danger btn-lg btn-block mt-5 mb-5">FIRE !!!</button>
        </form>
        <div>
            <div class="col-md-6 mx-auto bg-blur rounded text-white">
                <div class="card-body d-flex flex-column">
                    <h4 class="d-inline-block mb-2 text-primary align-self-center">The All Ships And Their Status</h4>
                    <div class="text-center">
                        <h5>Name -- Health -- Power </h5>
                        <ul>
                            <li class="font-weight-bold" th:each="s : ${allShips}"
                                th:text="|${s.name} -- ${s.health} -- ${s.power}|">| Name | Health | Power |</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
