<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body class="body-main">
<header th:replace="~{fragments/commons::nav}"></header>
<main role="main">
    <div class="jumbotron">
        <div class="container text-light ">
            <h1 class="display-3 ">
                <strong class="bg-blur rounded border-white pl-3 font-weight-bold">Add New Ship</strong></h1>
        </div>
        <div class="container bg-blur rounded p-5 mt-5 w-75">
            <form th:action="@{/ships/add}" th:object="${ship}" method="POST"
                  class=" text-center text-light">
                <div class="form-group row">
                    <label for="name" class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" th:field="*{name}"
                               aria-describedby="nameHelpInline" placeholder="Name">
                        <small id="nameHelpInline" class="bg-danger text-light rounded"
                               th:if="${#fields.hasErrors('name')}">Name must be between 2 and 10 characters and unique.</small>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="power" class="col-sm-2 col-form-label">Power</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" th:field="*{power}"
                               aria-describedby="powerHelpInline" placeholder="">
                        <small id="powerHelpInline" class="bg-danger text-light rounded"
                               th:if="${#fields.hasErrors('power')}">The power must be positive.</small>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="health" class="col-sm-2 col-form-label">Health</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" th:field="*{health}"
                               aria-describedby="healthHelpInline" placeholder="">
                        <small id="healthHelpInline" class="bg-danger text-light rounded"
                               th:if="${#fields.hasErrors('health')}">The health must be positive.</small>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="created" class="col-sm-2 col-form-label">Created date</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" th:field="*{created}"
                               aria-describedby="createdHelpInline" placeholder="">
                        <small id="createdHelpInline" class="bg-danger text-light rounded"
                               th:if="${#fields.hasErrors('created')}">Created date cannot be in the future.</small>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="category" class="col-sm-2 col-form-label">Category</label>
                    <div class="col-sm-10">
                        <select th:field="*{category}" class="custom-select"
                                aria-describedby="categoryHelpInline">
                            <option value="">Category</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">BATTLE</option>
                        </select>
                        <small id="categoryHelpInline" class="bg-danger text-light rounded"
                               th:if="${#fields.hasErrors('category')}">You must select the category.</small>
                    </div>
                </div>
                <button type="submit" class="btn btn-danger w-50">Add the new Ship</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
