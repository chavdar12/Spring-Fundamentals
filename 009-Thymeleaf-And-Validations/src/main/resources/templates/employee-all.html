<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
<header th:replace="~{fragments/commons::nav}"></header>
<main>
    <div class="container">
        <h2 class="text-center text-dark bg-light rounded-circle mt-5">All employees</h2>
        <hr style="width: 50%"/>
        <div class='row mb-4 d-flex justify-content-around'>
            <div class="col-md-4 d-flex flex-column bg-text mb-3 rounded" th:each="e : ${employees}">
                <h2 th:text="|Full name: ${e.firstName} ${e.lastName}|">Full name: {firstName} {lastName}</h2>
                <h4 th:text="|Job title: ${e.jobTitle}|">Job title: {jobTitle}</h4>
                <h4 th:text="|Birth Date: ${e.birthDate}|">Birth Date: {birthDate}</h4>
                <h4><a class="btn-block" th:href="@{/employees/{id}(id=${e.id})}">Detail info</a></h4>
            </div>
        </div>
        <div th:replace="~{fragments/commons::footer}"></div>
    </div>
</main>
</body>
</html>
