<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
<header th:replace="~{fragments/commons::nav}"></header>
<main>
    <div class="container">
        <div class="row">
            <div class="col-md-2"></div>
            <div class="jumbotron text-center rounded col-md-8 align-self-center">
                <div class="justify-content-center">
                    <h1>Add Company</h1>
                </div>
                <form class="m-md-auto w-50 text-center" th:action="@{/companies/add}" th:object="${company}" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control text-center" th:field="*{name}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error message</small>
                </div>
                <div class="form-group">
                    <label for="town">Town</label>
                    <input type="text" class="form-control text-center" th:field="*{town}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('town')}" th:errors="*{town}">Error message</small>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" class="form-control text-center" th:field="*{description}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error message</small>
                </div>
                <div class="form-group">
                    <label for="budget">Budget</label>
                    <input type="number" min="0" step="0.01" class="form-control text-center" th:field="*{budget}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('budget')}" th:errors="*{budget}">Error message</small>
                </div>
                    <button type="submit" class="btn btn-secondary">Add Company</button>
                </form>
            </div>
        </div>
        <div th:replace="~{fragments/commons::footer}"></div>
    </div>
</main>
</body>
</html>
