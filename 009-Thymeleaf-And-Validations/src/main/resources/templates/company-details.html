<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
<header th:replace="~{fragments/commons::nav}"></header>
<main>
    <div class="container">
        <div class="jumbotron text-center rounded col-md-12 align-self-center" th:object="${company}">
            <div class="justify-content-center">
                <h1>Company Details</h1>
            </div>
            <div class="row">
                <div class="col-md-6 bg-dark"><img src="/pic/company.png" height="350px" alt="Company"></div>
                <div class="col-md-6 bg-dark">
                    <h2>Company</h2>
                    <h4 th:text="|Name: *{name}|">Name: {name}</h4>
                    <h4 th:text="|Town: *{town}|">Town: {town}</h4>
                    <h4 th:text="|Description: *{description}|">Description: {description}</h4>
                    <h4 th:text="|Budget: *{budget}|">Budget: {budget}</h4>
                    <form class="align-bottom" th:action="@{/companies/{id}/delete(id=*{id})}" method="POST">
                        <button class="btn btn-danger align-bottom" type="submit">Delete company</button>
                    </form>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/commons::footer}"></div>
    </div>
</main>
</body>
</html>
