<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
<header th:replace="~{fragments/commons::nav}"></header>
<main>
    <div class="container">
        <div class="jumbotron text-center rounded col-md-12 align-self-center">
            <div class="justify-content-center">
                <h1>Add Employee</h1>
            </div>
            <form class="m-md-auto w-50 text-center" th:action="@{/employees/add}" th:object="${employee}" method="POST">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" class="form-control text-center" th:field="*{firstName}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Error message</small>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" class="form-control text-center" th:field="*{lastName}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Error message</small>
                </div>
                <fieldset class="form-group">
                    <legend>Choose Education Level</legend>
                    <div class="form-check" th:each="level : ${educationLevels}">
                        <label class="form-check-label">
                            <input type="radio" class="form-check-input" th:field="*{educationLevel}" th:value="${level}"/>
                            <span th:text="${#strings.capitalize(#strings.toLowerCase(level))}">Master</span>
                        </label>
                    </div>
                    <small class="text-danger" th:if="${#fields.hasErrors('educationLevel')}" th:errors="*{educationLevel}">Error message</small>
                </fieldset>
                <div class="form-group">
                    <label for="company"><h5>All available companies</h5></label>
                    <select class="form-control text-center" th:field="*{company}">
                        <option value="">Select a company</option>
                        <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}">First Company name</option>
                    </select>
                    <small class="text-danger" th:if="${#fields.hasErrors('company')}" th:errors="*{company}">Error message</small>
                </div>
                <div class="form-group">
                    <label for="jobTitle">Job Title</label>
                    <input type="text" class="form-control text-center" th:field="*{jobTitle}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('jobTitle')}" th:errors="*{jobTitle}">Error message</small>
                </div>
                <div class="form-group">
                    <label for="birthDate">Birth Date</label>
                    <input type="date" class="form-control text-center" th:field="*{birthDate}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}">Error message</small>
                </div>
                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" min="0" step="0.01" class="form-control text-center" th:field="*{salary}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}">Error message</small>
                </div>
                <button type="submit" class="btn btn-secondary">Add Employee</button>
            </form>
        </div>
        <div th:replace="~{fragments/commons::footer}"></div>
    </div>
</main>
</body>
</html>
