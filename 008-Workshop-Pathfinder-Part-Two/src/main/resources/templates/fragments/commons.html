<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pathfinder</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
          integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">
</head>
<body>
<header th:fragment="navigation">
    <nav class="main-nav">
        <ul>
            <li th:if="${@currentUser.loggedIn}"><a href="/home">Home</a></li>
            <li th:unless="${@currentUser.loggedIn}"><a href="/">Home</a></li>
            <th:block th:unless="${@currentUser.loggedIn}">
                <li><a href="/users/login">Login</a></li>
                <li><a href="/users/register">Register</a></li>
            </th:block>
            <li><a href="/about">About</a></li>
            <th:block th:if="${@currentUser.loggedIn}">
                <li><a href="/routes/add">Add new route</a></li>
                <li><a th:href="@{/users/profile/{id}(id=${@currentUser.id})}">Profile</a></li>
                <li th:if="${@currentUser.admin}"><a href="/home">Admin</a></li>
                <li><a href="/users/logout">Logout</a></li>
            </th:block>
        </ul>
    </nav>
</header>
<footer class="footer bg-blur rounded" th:fragment="footer">
    <div class="container-fluid text-center">
        <div class="h5 text-white">
            &copy; Lucho, Chocho &amp; Spring Advanced Students 2021. All rights reserved.
        </div>
    </div>
</footer>
</body>
</html>
