<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
    <header th:replace="~{fragments/commons::navigation}"></header>
<main class="d-flex justify-content-center">
    <form id="add-route-form" class="w-50 rounded text-white mt-5" th:action="@{/routes/add}"
          th:object="${routeModel}" method="POST" enctype="multipart/form-data">
        <h3 class="border-left border-light pl-2">Add a new route</h3>
        <div class="form-group">
            <label for="name" class="col-form-label ">Name</label>
            <input th:field="*{name}" type="text" class="form-control" th:errorclass="is-invalid">
            <small class="invalid-feedback bg-danger rounded" th:errors="*{name}">Name length must be between 5 and 20 characters</small>
        </div>
        <div class="form-group">
            <label for="description" class="col-form-label ">Description</label>
            <textarea th:field="*{description}" class="form-control" th:errorclass="is-invalid"></textarea>
            <small class="invalid-feedback form-text bg-danger rounded" th:errors="*{description}">Description length must be more than 5 characters</small>
        </div>
        <div class="form-group">
            <label for="gpxCoordinates" class="col-form-label ">GPX Coordinates</label>
            <input type="file" name="gpxCoordinates" id="gpxCoordinates" accept=".gpx" class="form-control-file"
                   th:classappend="${#fields.hasErrors('gpxCoordinates')} ? 'is-invalid'">
            <small class="invalid-feedback form-text bg-danger rounded" th:errors="*{gpxCoordinates}">Must be valid GPX Coordinates</small>
        </div>
        <div class="form-group">
            <label for="level">Level</label>
            <select th:field="*{level}" class="custom-select" th:errorclass="is-invalid">
                <option value="">Select level</option>
                <option th:each="l : ${levels}" th:value="${l}" th:text="${l}">ADVANCED</option>
            </select>
            <small class="invalid-feedback bg-danger rounded" th:errors="*{level}">Select a level</small>
        </div>
        <div class="form-group">
            <label for="videoUrl">Video Url (only last eleven characters from Youtube)</label>
            <input th:field="*{videoUrl}" type="text" class="form-control" placeholder="Video url">
        </div>
        <div class="form-group p-3">
            <span class="p-2">Categories:</span>
            <label class="m-3" th:each="c : ${categories}">
                <input type="checkbox" th:field="*{categories}" th:value="${c}"> <span th:text="${c}">Category</span>
            </label>
            <small class="text-danger d-block" th:errors="*{categories}">Choose at least one category</small>
        </div>
        <div class="d-flex justify-content-center mt-4">
            <button class="btn btn-primary btn-block w-50" type="submit">Add Route</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
