<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
<div class="wrapper">
    <header th:replace="~{fragments/commons::navigation}"></header>
    <div class="details-main" th:object="${route}">
        <section class="route-info text-center">
            <h4 id="track-name" th:text="*{name}"></h4>
            <p>Author name: <span id="authorName" th:text="*{author?.fullName}"></span></p>
            <h4>Difficulty Level (1-3):</h4>
            <div class="level">
                <p th:each="i : ${#numbers.sequence(0, route.level.ordinal())}">
                    <img class="level-img" src="/images/difficulty-level.png" alt="Level">
                </p>
            </div>
            <p th:text="|Categories: ${#strings.listJoin(route.categories.![name], ', ')}|">Categories</p>
        </section>
        <section id="video" th:if="*{videoUrl}">
            <iframe id="frame" th:src="|https://www.youtube.com/embed/*{videoUrl}|" title="Route video"></iframe>
        </section>
        <section class="route-description text-center">
            <h4>Description:</h4>
            <p id="route-description" th:text="*{description}">Description</p>
        </section>
        <section class="gallery">
            <img class="rounded" th:each="p : *{pictures}" th:src="${p.url}" th:alt="${p.title}" height="100%">
        </section>
        <section class="comments">
            <h1>Comments</h1>
            <div th:each="c : *{comments}" th:if="${c.approved}">
                <p><strong th:text="${c.author.fullName}">Author</strong>
                    <span th:text="${#temporals.format(c.created, 'dd.MM.yyyy HH:mm')}">date</span></p>
                <p th:text="${c.textContent}">Comment</p>
            </div>
        </section>
    </div>
</div>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
