<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
    <header th:replace="~{fragments/commons::navigation}"></header>
<main class="p-5 align-content-center bg-blur my-register-div" th:object="${user}">
    <div class="container mt-5">
        <div class="row d-flex justify-content-center">
            <div class="col-md-7">
                <div class="profile-card p-3 py-4">
                    <div class="text-center"><img src="/images/profile.jpg" width="100" class="rounded-circle" alt="Profile"></div>
                    <div class="text-center mt-3">
                        <span class="bg-secondary p-1 px-4 rounded text-white" th:text="*{level}">Pro</span>
                        <h5 class="mt-4 mb-0">Full name</h5>
                        <span th:text="*{fullName}">Full name</span>
                        <h5 class="mt-2 mb-0">Username</h5>
                        <span th:text="*{username}">Username</span>
                        <h5 class="mt-2 mb-0">Age</h5>
                        <span th:text="*{age}">33</span>
                        <div class="buttons mt-4">
                            <a class="btn btn-outline-primary px-4" href="/home">Back</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
