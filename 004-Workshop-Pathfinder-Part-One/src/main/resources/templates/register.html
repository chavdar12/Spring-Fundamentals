<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
    <header th:replace="~{fragments/commons::navigation}"></header>
<main class="p-5 align-content-center bg-blur my-register-div">
    <h1 class="border-bottom">Register</h1>
    <div class="d-flex justify-content-center ">
        <div class="row g-3">
            <form th:action="@{/users/register}" th:object="${userModel}" method="POST">
                <p class="text-danger" th:if="${registerFailed}">Passwords do not match or the username is taken.</p>
                <div>
                    <div class="col-auto">
                        <label class="col-form-label" for="username">Username</label>
                    </div>
                    <div class="col-auto">
                        <input class="form-control" th:field="*{username}" type="text"
                              >
                    </div>
                </div>
                <div>
                    <div class="col-auto">
                        <label class="col-form-label" for="fullName">Full Name</label>
                    </div>
                    <div class="col-auto">
                        <input class="form-control" th:field="*{fullName}" type="text"
                              >
                    </div>
                </div>
                <div>
                    <div class="col-auto">
                        <label class="col-form-label" for="email">Email</label>
                    </div>
                    <div class="col-auto">
                        <input class="form-control" th:field="*{email}" type="email"
                              >
                    </div>
                </div>
                <div>
                    <div class="col-auto">
                        <label class="col-form-label" for="age">Age</label>
                    </div>
                    <div class="col-auto">
                        <input class="form-control" th:field="*{age}" type="number"
                              >
                    </div>
                </div>
                <div>
                    <div class="col-auto">
                        <label class="col-form-label" for="password">Password</label>
                    </div>
                    <div class="col-auto">
                        <input class="form-control" th:field="*{password}" type="password"
                              >
                    </div>
                </div>
                <div>
                    <div class="col-auto">
                        <label class="col-form-label" for="confirmPassword">Confirm Password</label>
                    </div>
                    <div class="col-auto">
                        <input class="form-control" th:field="*{confirmPassword}" type="password"
                              >
                    </div>
                </div>
                <div class="d-flex justify-content-center mt-4">
                    <button class="btn btn-primary btn-block w-50" type="submit">Register</button>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
