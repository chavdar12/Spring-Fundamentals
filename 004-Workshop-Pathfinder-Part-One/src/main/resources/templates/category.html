<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}"></head>
<body>
<div class="wrapper">
    <header th:replace="~{fragments/commons::navigation}"></header>
    <section class="road" th:each="route, iter : ${routes}">
        <div>
            <h2 th:text="${route.name}">Title</h2>
            <p th:text="${#strings.abbreviate(route.description, 300)}">Very long description</p>
            <a th:href="@{/routes/details/{id}(id=${route.id})}" class="btn">Learn More</a>
        </div>
        <img class="rounded-circle w-75 ml-5" th:src="|/images/pic${iter.index % 4 + 1}.jpg|" alt="Route image">
    </section>
    <section class="road" th:if="${routes.isEmpty()}">
        <div><h2 th:text="|No ${#strings.toLowerCase(category)} routes yet.|">No routes yet.</h2></div>
    </section>
</div>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
