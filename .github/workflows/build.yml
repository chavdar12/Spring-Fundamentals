name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 001-Spring-Boot-Introduction
          - 002-Exercise-Spring-Boot-Introduction
          - 003-Spring-Introduction-MVC
          - 004-Workshop-Pathfinder-Part-One
          - 005-State-Management
          - 006-Spring-Essentials
          - 007-Spring-Essentials-Cloudinary-Demo
          - 008-Workshop-Pathfinder-Part-Two
          - 009-Thymeleaf-And-Validations
          - 010-Exam-Preparation-Coffee-Shop
          - 012-Regular-Exam-Battle-Ships
          - 013-Retake-Exam-Shopping-List
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.project }}
          path: ${{ matrix.project }}/build/reports/tests/

  front-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 011-Bootstrap-Front-End-Basics
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test
        run: npm test
